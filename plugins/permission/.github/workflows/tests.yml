name: tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'

jobs:
  tests:
    name: php ${{ matrix.php }} ${{ matrix.dependencies }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer update --no-interaction --prefer-dist ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
      - run: composer show spatie/laravel-permission
      - run: vendor/bin/pest

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
      - run: composer update --no-interaction --prefer-dist
      - run: composer lint
      - run: composer analyse
      - run: composer types
