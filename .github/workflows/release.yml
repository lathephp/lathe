name: release

# A tag push v* publishes. Started by hand with dry_run (the default), it runs every check,
# packs and smoke-installs, and publishes nothing: the publish, release and dispatch jobs skip.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check and the smoke install, publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  word-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: bash scripts/check-word.sh

  required:
    needs: word-check
    # A called workflow gets at most the caller's permissions; ci.yml's weekly jobs declare issues: write.
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/ci.yml

  smoke:
    needs: required
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: composer install --no-interaction --prefer-dist
      - run: pnpm install --frozen-lockfile
      # A tag commit carries dist/; a dry run on main builds it first.
      - run: test -f dist/manifest.json || pnpm build
      - run: bash scripts/release-smoke.sh
      - name: Check the tag matches every package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: php vendor/bin/pest tests/Feature/Release/VersionAlignmentTest.php
        env:
          LATHE_RELEASE_TAG: ${{ github.ref_name }}

  publish-npm:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' build
      # Trusted publishing: npm reads the job's OIDC token, so no npm token is stored anywhere.
      - name: Publish @lathephp/core, @lathephp/ui and @lathephp/vite-plugin
        run: |
          version="${GITHUB_REF_NAME#v}"
          dist_tag=latest
          if [[ $version == *-* ]]; then dist_tag=beta; fi
          for package in core ui vite-plugin; do
            (cd "packages/$package" && npm publish --provenance --access public --tag "$dist_tag")
          done

  github-release:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" 'index($0, heading) == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          prerelease=()
          if [[ $version == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --title "Lathe $version" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag "${prerelease[@]}"

  dispatch:
    needs: [publish-npm, github-release]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the docs site build and the benchmark re-run
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
        run: |
          gh api repos/lathephp/lathephp.com/dispatches -f event_type=lathe-release -f "client_payload[tag]=$GITHUB_REF_NAME"
          gh api repos/lathephp/benchmarks/dispatches -f event_type=lathe-release -f "client_payload[tag]=$GITHUB_REF_NAME"
