name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: php ${{ matrix.php }} ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        database: ['sqlite', 'mysql:8.4', 'mariadb:10.11', 'postgres:15']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
        env:
          LATHE_DATABASE: ${{ matrix.database }}

  php-lowest:
    name: php-lowest ${{ matrix.php }} ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        database: ['sqlite', 'mysql:8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
      - run: composer test
        env:
          LATHE_DATABASE: ${{ matrix.database }}

  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: composer install --no-interaction --prefer-dist
      - run: pnpm install --frozen-lockfile
      - run: composer test:scaffold

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer analyse
      - run: composer types
      - run: composer mutate
      - run: bash scripts/check-patterns.sh
      - run: php vendor/bin/testbench lathe:api-check
      - run: bash scripts/check-word.sh
      - run: composer audit --locked

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm types
      - run: pnpm lint
      - run: pnpm -r test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: composer install --no-interaction --prefer-dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -C workbench/lathe-components/Heartbeat build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: LATHE_BROWSER_PROJECT=desktop-chrome composer test:browser
      - run: LATHE_BROWSER_PROJECT=desktop-firefox composer test:browser -- --browser firefox
      - run: LATHE_BROWSER_PROJECT=desktop-safari composer test:browser -- --browser safari
      - run: LATHE_BROWSER_PROJECT=phone-android composer test:browser
      - run: LATHE_BROWSER_PROJECT=phone-ios composer test:browser -- --browser safari
