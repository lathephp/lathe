laravel: '@testbench'

providers:
  - Lathe\LatheServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Workbench\App\Providers\LatheServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

env:
  - DB_CONNECTION=sqlite
  - SESSION_DRIVER=file
  - QUEUE_CONNECTION=database
  - MAIL_MAILER=log
  # Starting an impersonation lands in the panel, so the banner shows at once.
  - LATHE_IMPERSONATION_STARTED=/lathe
  - LATHE_FORTIFY_FEATURES=update-passwords,two-factor-authentication,email-verification

workbench:
  start: '/lathe'
  install: true
  health: true
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: false
  build:
    - create-sqlite-db
    - migrate:
        --seed: true
        --seeder: 'Workbench\Database\Seeders\DatabaseSeeder'
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
