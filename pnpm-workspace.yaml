packages:
  - packages/*
  - workbench/lathe-components/*

# The root holds the panel app and its Vitest projects, so `pnpm -r test` runs it too.
includeWorkspaceRoot: true

# Every package is at least two weeks old: Tiptap 3.31.3 would pull in releases from 2026-09-30 and later.
overrides:
  fast-equals: 5.4.3
  '@tiptap/extension-bubble-menu': 3.31.3
  '@tiptap/extension-floating-menu': 3.31.3
